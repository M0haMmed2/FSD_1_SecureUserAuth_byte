<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure User Authentication</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 500px; margin: 40px auto; padding: 20px; background: #f9f9f9; color: #333; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 20px; }
        h2 { margin-top: 0; }
        input { width: 100%; padding: 10px; margin: 8px 0; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        button { width: 100%; background: #28a745; color: white; padding: 10px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        button:hover { background: #218838; }
        .protected-btn { background: #007bff; }
        .protected-btn:hover { background: #0056b3; }
        .status { padding: 12px; margin-top: 10px; border-radius: 4px; display: none; font-weight: bold; }
        .success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    </style>
</head>
<body>

    <div class="card">
        <h2>1. Register Account</h2>
        <input type="text" id="reg-username" placeholder="Username">
        <input type="password" id="reg-password" placeholder="Password">
        <button onclick="register()">Register</button>
    </div>

    <div class="card">
        <h2>2. Login</h2>
        <input type="text" id="login-username" placeholder="Username">
        <input type="password" id="login-password" placeholder="Password">
        <button onclick="login()">Login</button>
    </div>

    <div class="card">
        <h2>3. Protected Area</h2>
        <button class="protected-btn" onclick="fetchProtectedData()">Fetch Protected Data</button>
        <div id="status-box" class="status"></div>
    </div>

    <script>
        const API_BASE = 'http://127.0.0.1:8000/api';
        let userToken = '';

        function showStatus(message, isSuccess) {
            const box = document.getElementById('status-box');
            box.style.display = 'block';
            box.className = 'status ' + (isSuccess ? 'success' : 'error');
            box.innerText = message;
        }

        async function register() {
            const username = document.getElementById('reg-username').value;
            const password = document.getElementById('reg-password').value;

            if (!username || !password) {
                showStatus('Please enter both username and password.', false);
                return;
            }

            try {
                const res = await fetch(`${API_BASE}/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await res.json();
                if (res.ok) {
                    showStatus(data.message, true);
                } else {
                    showStatus(data.detail || 'Registration failed', false);
                }
            } catch (err) {
                showStatus('Cannot connect to server. Is FastAPI running on port 8000?', false);
            }
        }

        async function login() {
            const username = document.getElementById('login-username').value;
            const password = document.getElementById('login-password').value;

            if (!username || !password) {
                showStatus('Please enter both username and password.', false);
                return;
            }

            try {
                const res = await fetch(`${API_BASE}/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await res.json();
                if (res.ok) {
                    userToken = data.access_token;
                    showStatus('Logged in successfully! Token stored.', true);
                } else {
                    showStatus(data.detail || 'Login failed', false);
                }
            } catch (err) {
                showStatus('Cannot connect to server. Is FastAPI running on port 8000?', false);
            }
        }

        async function fetchProtectedData() {
            if (!userToken) {
                showStatus('Access Denied: You must login first to obtain a JWT token!', false);
                return;
            }

            try {
                const res = await fetch(`${API_BASE}/protected`, {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${userToken}`
                    }
                });

                const data = await res.json();
                if (res.ok) {
                    showStatus(`${data.message} | ${data.secret_data}`, true);
                } else {
                    showStatus(data.detail || 'Access denied', false);
                }
            } catch (err) {
                showStatus('Error fetching protected data.', false);
            }
        }
    </script>
</body>
</html>
